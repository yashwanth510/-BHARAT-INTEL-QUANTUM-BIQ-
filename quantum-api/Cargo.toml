[package]
name = "quantum-api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.5"
actix-cors = "0.7"
actix = "0.13"
actix-web-actors = "4.3"
tokio = { version = "1.36", features = ["full"] }
pqcrypto-kyber = "0.8.1"
pqcrypto-traits = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
neo4rs = "0.7"
rdkafka = { version = "0.36.2", features = ["cmake-build"], optional = true }
redis = { version = "0.25", features = ["tokio-comp"] }
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
twitter-v2 = "0.1.8"
reqwest = { version = "0.12", features = ["json"] }
xml-rs = "0.8"
scraper = "0.20"
futures-util = "0.3"
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
roxmltree = "0.19"
urlencoding = "2.1"
uuid = { version = "1.8", features = ["v4"] }

[features]
default = ["kafka"]
kafka = ["rdkafka"]

[dev-dependencies]
tokio-tungstenite = "0.21"
testcontainers = "0.15"
actix-rt = "2.9"
awc = "3.3"
