version: '3.8'

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  bharat-net:
    driver: bridge
  observability-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  neo4j_data:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Redis (Cache / Rate Limit / Pub-Sub) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: biq-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-biq-default-pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-biq-default-pass} ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bharat-net

  # ── Neo4j (Intelligence Graph) ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: biq-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASS:-password123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASS:-password123} 'RETURN 1' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - bharat-net

  # ── Kafka (KRaft mode, no Zookeeper) ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: biq-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,ANYWHERE:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,ANYWHERE://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,ANYWHERE://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3odaISbe9pS4KMDXW2A'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - bharat-net

  # ── Quantum API (Rust backend) ────────────────────────────────────────────────
  quantum-api:
    build:
      context: ./quantum-api
      dockerfile: Dockerfile
    container_name: biq-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Infrastructure
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: ${NEO4J_PASS:-password123}
      KAFKA_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD:-biq-default-pass}@redis:6379
      PORT: 8000

      # Provider API Keys
      CHAINALYSIS_KEY: ${CHAINALYSIS_KEY:-}
      MISTTRACK_API_KEY: ${MISTTRACK_API_KEY:-}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # LLM / Mistral
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      LLM_MODEL: ${LLM_MODEL:-mistral-small-latest}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_ONLY_ON_NEW_EVENTS: ${LLM_ONLY_ON_NEW_EVENTS:-true}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-3600}
      LLM_MAX_REQUESTS_PER_DAY: ${LLM_MAX_REQUESTS_PER_DAY:-150}

      # Rate Limiting
      NEWSAPI_MAX_PER_DAY: ${NEWSAPI_MAX_PER_DAY:-80}
      NEWSAPI_POLL_SECONDS: ${NEWSAPI_POLL_SECONDS:-1800}
      OPENWEATHER_MAX_PER_DAY: ${OPENWEATHER_MAX_PER_DAY:-800}
      OPENWEATHER_POLL_SECONDS: ${OPENWEATHER_POLL_SECONDS:-300}
      MARITIME_MAX_PER_HOUR: ${MARITIME_MAX_PER_HOUR:-60}
      MARITIME_POLL_SECONDS: ${MARITIME_POLL_SECONDS:-300}
      AISSTREAM_MAX_VESSELS: ${AISSTREAM_MAX_VESSELS:-20}

      # Geospatial
      GOOGLE_ELEVATION_API_KEY: ${ELEVATION_API_KEY:-}
      ELEVATION_BATCH_SIZE: ${ELEVATION_BATCH_SIZE:-50}
      ELEVATION_ON_DEMAND_ONLY: ${ELEVATION_ON_DEMAND_ONLY:-true}
      ELEVATION_LOCATIONS: ${ELEVATION_LOCATIONS:-34.1526,77.5770|Ladakh;34.5553,76.1340|KargilSector}

      # Intelligence Config
      RSS_FEEDS: ${RSS_FEEDS:-https://www.dawn.com/rss/latest,https://www.globaltimes.cn/rss}
      THREAT_KEYWORDS: ${THREAT_KEYWORDS:-border,incursion,terror,weapon,vessel}
      WEATHER_ZONES: ${WEATHER_ZONES:-34.1526,77.5770|Ladakh;34.5553,76.1340|KargilSector}
      ACTIVE_ZONE_MULTIPLIER: ${ACTIVE_ZONE_MULTIPLIER:-2}
      ACTIVE_ALERT_MODE: ${ACTIVE_ALERT_MODE:-false}

      # Logging
      RUST_LOG: info

    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - bharat-net
    labels:
      - "prometheus.scrape=true"
      - "prometheus.path=/metrics"
      - "prometheus.port=8000"

  # ── Frontend (Next.js + nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    container_name: biq-frontend
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      quantum-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ 2>/dev/null | grep -q 'BIQ' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - bharat-net

  # ── Prometheus (Metrics) ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: biq-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - bharat-net
      - observability-net
    profiles:
      - observability

  # ── Grafana (Dashboards) ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: biq-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-biq-admin}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - observability-net
    profiles:
      - observability

  # ── Loki (Log aggregation) ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: biq-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability-net
    profiles:
      - observability
