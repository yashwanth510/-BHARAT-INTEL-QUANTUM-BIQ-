name: Native checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y redis-server pkg-config libssl-dev
      - run: cargo fmt --check --manifest-path backend/Cargo.toml
      - run: cargo test --locked --manifest-path backend/Cargo.toml
      - run: cargo build --locked --manifest-path backend/Cargo.toml
      - run: python3 -m pip install websockets
      - run: python3 scripts/test_backend.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
