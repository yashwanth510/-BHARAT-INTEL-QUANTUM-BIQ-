name: BIQ CI/CD v2 
 
 on: 
   push: 
     branches: [main, develop] 
   pull_request: 
 
 concurrency: 
   group: ${{ github.workflow }}-${{ github.ref }} 
   cancel-in-progress: true 
 
 jobs: 
 
   # ───────────────────────────────────────────── 
   # 1. SECURITY (FAIL FAST) 
   # ───────────────────────────────────────────── 
   security: 
     name: "Security Scan" 
     runs-on: ubuntu-latest 
     steps: 
       - uses: actions/checkout@v4 
 
       - name: Trivy scan 
         uses: aquasecurity/trivy-action@master 
         with: 
           scan-type: fs 
           severity: CRITICAL,HIGH 
           exit-code: 1 
 
   # ───────────────────────────────────────────── 
   # 2. LINT & TYPECHECK 
   # ───────────────────────────────────────────── 
   lint-backend: 
     runs-on: ubuntu-latest 
     needs: security 
     steps: 
       - uses: actions/checkout@v4 
 
       - uses: dtolnay/rust-toolchain@stable 
         with: 
           components: rustfmt, clippy 
 
       - uses: Swatinem/rust-cache@v2 
         with: 
           workspaces: quantum-api 
 
       - run: cargo fmt --all -- --check 
         working-directory: quantum-api 
 
       - run: cargo clippy --all-targets --all-features -- -D warnings 
         working-directory: quantum-api 
 
   lint-frontend: 
     runs-on: ubuntu-latest 
     needs: security 
     steps: 
       - uses: actions/checkout@v4 
 
       - uses: actions/setup-node@v4 
         with: 
           node-version: 20 
           cache: npm 
           cache-dependency-path: frontend/package-lock.json 
 
       - run: npm ci 
         working-directory: frontend 
 
       - run: npx tsc --noEmit 
         working-directory: frontend 
 
       - run: npm run lint 
         working-directory: frontend 
 
   # ───────────────────────────────────────────── 
   # 3. BUILD (FAST + CACHED) 
   # ───────────────────────────────────────────── 
   build-backend: 
     runs-on: ubuntu-latest 
     needs: lint-backend 
     steps: 
       - uses: actions/checkout@v4 
 
       - uses: dtolnay/rust-toolchain@stable 
 
       - uses: Swatinem/rust-cache@v2 
         with: 
           workspaces: quantum-api 
 
       - run: cargo test --lib --bins 
         working-directory: quantum-api 
 
       - run: cargo build --release 
         working-directory: quantum-api 
 
   build-frontend: 
     runs-on: ubuntu-latest 
     needs: lint-frontend 
     steps: 
       - uses: actions/checkout@v4 
 
       - uses: actions/setup-node@v4 
         with: 
           node-version: 20 
           cache: npm 
           cache-dependency-path: frontend/package-lock.json 
 
       - run: npm ci 
         working-directory: frontend 
 
       - run: npm run build 
         working-directory: frontend 
 
   # ───────────────────────────────────────────── 
   # 4. DEPLOY (STAGING / PROD ONLY) 
   # ───────────────────────────────────────────── 
 
   deploy-staging: 
     name: "Deploy Staging" 
     if: github.ref == 'refs/heads/develop' 
     needs: [build-backend, build-frontend] 
     runs-on: ubuntu-latest 
     steps: 
       - run: echo "Deploy handled by Railway + Vercel Git integration" 
 
   deploy-production: 
     name: "Deploy Production" 
     if: github.ref == 'refs/heads/main' 
     needs: [build-backend, build-frontend] 
     runs-on: ubuntu-latest 
     steps: 
       - run: echo "Production deploy handled by Railway + Vercel" 
